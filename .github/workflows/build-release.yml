name: Build and Release APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json 2>/dev/null | tee build-result.json
          BUILD_URL=$(jq -r 'if type == "array" then .[0].artifacts.buildUrl else .artifacts.buildUrl end' build-result.json)
          if [ -z "$BUILD_URL" ] || [ "$BUILD_URL" = "null" ]; then
            echo "ERROR: Could not get build URL. Check EXPO_TOKEN secret and build logs."
            cat build-result.json
            exit 1
          fi
          echo "url=$BUILD_URL" >> $GITHUB_OUTPUT

      - name: Download APK
        run: curl -L "${{ steps.build.outputs.url }}" -o odonto-gestao.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Odonto Gestão v1.0.${{ github.run_number }}"
          body: "Built automatically from commit ${{ github.sha }}"
          files: odonto-gestao.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
